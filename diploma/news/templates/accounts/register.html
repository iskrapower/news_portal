{% extends 'base.html' %}
{% block menu %}
    <li class="nav-item">
        <a class="nav-link" href="{% url 'newsfeed:article_create' %}">Создать</a>
    </li>
{% endblock %}
{% block content %}
    <div class="login-form-container">
        <p class="login-form-title">Регистрация</p>
        <form action="{% url 'accounts:register' %}" method="post" class="text-center">
            {% csrf_token %}
            {% if has_error %}
                <p class="form-error">Неверное имя пользователя или пароль.</p>
            {% endif %}
            <div class="form-group">
                <label for="username" class="form-label">Email</label>
                <input type="email" name="username" id="username" class="form-input">
            </div>
            <div class="form-group">
                <label for="username" class="form-label">Имя пользователя</label>
                <input type="text" name="username" id="username" class="form-input">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" name="password" id="password" class="form-input">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Подтвердите Пароль</label>
                <input type="password" name="password_confirm" id="password_confirm" class="form-input">
            </div>
            <button type="submit" class="login-form-button">Регистрация</button>
        </form>
    </div>
    <p class="register-link">
        Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войти</a>
    </p>
{% endblock %}
