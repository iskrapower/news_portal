{% extends 'base.html' %}
{% block content %}
    <h2>{{ article.title }}</h2>
    <div>
        <span class="author">{{ article.author.username }}</span> |
        <span class="date">{{ article.published_at|date:"d M Y" }}</span>
    </div>
    <p>
        {{ article.description }}
    </p>
    <p>
        Topics: 
        {% for topic in topics %}
            <span>topic{% if not forloop.last %},{% endif %}</span>
        {% endfor %}
    </p>
    <div>
        <a href="{% url 'newsfeed:article_update' article.id %}">Update</a>
        <form action="{% url 'newsfeed:article_delete' article.id %}" method="post" onsubmit="return('Delete?')">
            {% csrf_token %}
            <input type="submit" value="Delete">
        </form>
    </div>
{% endblock %}
